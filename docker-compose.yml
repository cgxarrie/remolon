services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retrodb
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retrodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (.NET) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./RetroBackend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5145:8080"   # exposes backend directly for dev/Swagger access
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=retrodb;Username=retro;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Jwt__Issuer: RetroBackend
      Jwt__Audience: RetroBackendClients
      # frontend container is on port 3000 – allow it as CORS origin
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
      Email__SmtpUser: "${EMAIL_SMTP_USER:-}"
      Email__SmtpPassword: "${EMAIL_SMTP_PASSWORD:-}"
      Email__From: "noreply@remolon.local"
      Email__FrontendBaseUrl: "http://localhost:3000"
      DataProtection__KeysDirectory: /var/dataprotection-keys
    volumes:
      - dataprotection_keys:/var/dataprotection-keys
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── Mailpit (local SMTP catcher) ────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped

  # ── Frontend (nginx) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./RetroFrontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  dataprotection_keys:
