services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retrodb
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retrodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  keys-init:
    image: busybox:1.37
    command: ["chown", "-R", "1654:1654", "/var/dataprotection-keys"]
    user: "0"
    volumes:
      - dataprotection_keys:/var/dataprotection-keys

  migrate:
    build:
      context: ./RetroBackend
      dockerfile: Dockerfile
    command: ["dotnet", "RetroBackend.dll", "--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=retrodb;Username=retro;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Jwt__Issuer: RetroBackend
      Jwt__Audience: RetroBackendClients
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend (.NET) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./RetroBackend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_ALLOWEDHOSTS: "localhost;127.0.0.1"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=retrodb;Username=retro;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Jwt__Issuer: RetroBackend
      Jwt__Audience: RetroBackendClients
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      Email__SmtpHost: "${EMAIL_SMTP_HOST:-mailpit}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT:-1025}"
      Email__SmtpUser: "${EMAIL_SMTP_USER:-}"
      Email__SmtpPassword: "${EMAIL_SMTP_PASSWORD:-}"
      Email__EnableSsl: "${EMAIL_SMTP_ENABLE_SSL:-false}"
      Email__From: "${EMAIL_FROM:-noreply@remolon.local}"
      Email__FrontendBaseUrl: "http://localhost:3000"
      DataProtection__KeysDirectory: /var/dataprotection-keys
    volumes:
      - dataprotection_keys:/var/dataprotection-keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keys-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # ── Mailpit (local SMTP catcher) ────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped

  # ── Frontend (nginx) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./RetroFrontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: "${BACKEND_UPSTREAM:-http://backend:8080}"
      NGINX_RESOLVER: "${NGINX_RESOLVER:-127.0.0.11 ipv6=off valid=10s}"
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  dataprotection_keys:
